# Ships Airlock from GitHub, no PC needed.
#   web:     every push to main → build web/ → Cloudflare Pages project "airlock" (the live site + PWA)
#   release: if package.json's version has no GitHub Release yet → build the Windows installer, publish
#            vX.Y.Z (installed apps auto-update from it), upload it to R2 and refresh the site's download link
# Secrets (repo → Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN  — custom token: Cloudflare Pages:Edit, Workers Scripts:Edit, Workers R2 Storage:Edit (personal account)
#   CLOUDFLARE_ACCOUNT_ID — the 32-char id in the dashboard URL
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  web:
    name: Web (Cloudflare Pages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci --ignore-scripts
      - run: node build-web.js
      - name: Deploy to Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy web --project-name airlock --branch main --commit-dirty=true

  release:
    name: Windows installer + GitHub Release
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - name: Is this version already released?
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "released=true" >> "$GITHUB_OUTPUT"; echo "v$V already on GitHub — skipping"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"; echo "v$V not released yet — building"
          fi
      - if: steps.check.outputs.released == 'false'
        run: npm ci
      - name: Build and publish v${{ steps.check.outputs.version }}
        if: steps.check.outputs.released == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release
      - name: Upload installer to R2 and refresh the download link
        if: steps.check.outputs.released == 'false'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run publish:installer
